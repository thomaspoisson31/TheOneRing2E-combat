<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOR2E - Visualiseur d'adversaires</title>
    <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
    <header></header>

    <!-- Main Navigation Tab Bar -->
    <div class="main-tab-bar-container">
        <div class="main-tab-bar">
            <!-- Pinned Engagement Tab (Stage 1) -->
            <button id="engagementTab" class="tab-btn engagement-tab active" title="Engagement" onclick="switchTab('engagement')">
                <img src="images/sword-line.svg" alt="Engagement" class="tab-icon">
            </button>
            <button id="battlemapTab" class="tab-btn engagement-tab" title="Battlemap" style="display: none;" onclick="toggleBattlemapWindow()">
                <img src="images/map.svg" alt="Battlemap" class="tab-icon">
            </button>

            <!-- Stage 2 Fighter Tabs Strip -->
            <div class="fighter-tabs-wrapper">
                <button id="scrollLeftBtn" class="scroll-arrow-btn left" onclick="scrollFighterTabs(-1)" style="display: none;">&#9664;</button>
                <div id="fighterTabsContainer" class="fighter-tabs-scroll"></div>
                <button id="scrollRightBtn" class="scroll-arrow-btn right" onclick="scrollFighterTabs(1)" style="display: none;">&#9654;</button>
            </div>
        </div>
    </div>

    <!-- Main Framed Box with Red Border -->
    <div class="main-content-frame">
        <!-- Stage 1: Engagement View -->
        <div id="engagementView" class="engagement-view">
            <div class="engagement-layout">
                <div class="engagement-left">
                    <!-- Inline Battlemap -->
                    <div id="inlineBattlemap" class="battlemap-container inline-battlemap">
                        <img id="inlineBattlemapImg" src="images/LAU-Stance-Mat-Grass.jpg" alt="Battlemap" class="battlemap-image" usemap="#inline-image-map">
                        <map name="inline-image-map">
                            <area target="" alt="AVANCE" title="AVANCE" href="" coords="1513,1150,2057,1374,2578,1135,2703,1273,2732,1465,2549,1678,2122,1790,1719,1750,1422,1580,1375,1295" shape="poly">
                            <area target="" alt="EXPOSEE" title="EXPOSEE" href="" coords="1205,1011,1516,1145,1364,1369,1502,1648,1875,1771,2200,1778,2526,1677,2692,1500,2700,1268,2577,1138,2873,1008,3094,1279,3156,1489,3025,1800,2707,2049,2186,2180,1683,2144,1267,1963,1013,1731,945,1366,1021,1178" shape="poly">
                            <area target="" alt="DEFENSIVE" title="DEFENSIVE" href="" coords="880,866,1202,1007,959,1329,992,1691,1260,1962,1520,2096,2034,2172,2360,2150,2743,2013,2928,1875,3098,1648,3141,1412,3058,1199,2881,1000,3199,859,3510,1152,3655,1459,3666,1798,3445,2185,3051,2478,2479,2646,1972,2679,1469,2606,999,2440,681,2201,424,1769,442,1412,623,1105" shape="poly">
                            <area target="" alt="ARRIERE" title="ARRIERE" href="" coords="413,1685,644,2231,1216,2549,1820,2687,2464,2680,3090,2474,3517,2162,3662,1707,4089,1714,4093,3381,15,3385,8,1699" shape="poly">
                        </map>
                        <div id="inlineBattlemapTokensOverlay" class="battlemap-tokens-overlay"></div>
                        <button id="expandBattlemapBtn" class="battlemap-expand-btn" title="Agrandir la battlemap" onclick="toggleBattlemapWindow()">⛶</button>
                    </div>

                    <div id="creatureTabs" class="creature-tabs player-columns-container"></div>
                </div>

                <div class="adversaries-panel" id="adversariesPanel">
                    <div class="adversaries-header">
                        <div class="adversaries-title-group">
                            <h2 class="adversaries-title">Adversaires</h2>
                            <button id="openFileModalBtn" class="folder-btn" title="Changer de liste" onclick="openFileModal()">
                                <img src="images/folder-outline-rounded.svg" alt="Dossier" class="folder-icon">
                            </button>
                        </div>
                        <div class="engagement-actions">
                            <button id="randomAssociationBtn" class="red-square-btn" title="Association aléatoire" style="display: none;" onclick="performRandomAssociation()">
                                <img src="images/shuffle-line.svg" alt="Association aléatoire">
                            </button>
                            <button id="validateEngagementBtn" class="red-square-btn" title="Valider" onclick="validateEngagement()">
                                <img src="images/check-outline.svg" alt="Valider">
                            </button>
                        </div>
                    </div>
                    <div id="adversariesListContainer" class="adversaries-list-container"></div>
                </div>
            </div>
        </div>

        <!-- Stage 2: Fighter View (Detail Card + Left Illustration) -->
        <div id="fighterView" class="fighter-view" style="display: none;">
            <div class="fighter-view-layout">
                <div id="fighterImageContainer" class="fighter-image-container">
                    <img id="fighterIllustrationImg" src="" alt="Illustration" class="fighter-illustration-img">
                </div>
                <div class="fighter-card-container">
                    <div id="creatureCard" class="creature-card"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="fullScreenImage" class="full-screen-image">
        <img id="creatureImage" src="" alt="Image de la créature">
    </div>

    <!-- Fenêtre modale pour les cartes -->
    <div id="cardModal" class="modal">
        <div class="modal-content card-modal">
            <button class="close-button" onclick="closeCardModal()">×</button>
            <div id="cardContent"></div>
        </div>
    </div>

    <!-- Fenêtre modale pour le changement de fichier -->
    <div id="fileModal" class="modal">
        <div class="modal-content">
            <button class="close-button" onclick="closeFileModal()">×</button>
            <h3>Choisir une liste</h3>
            <ul id="fileList" class="file-list">
                <li data-file="Adversaires-Campagne-Moria.xml">Adversaires Campagne Moria</li>
            </ul>
            <button onclick="loadSelectedFile()" class="load-button">Charger</button>
        </div>
    </div>

    <!-- Fenêtre volante pour la Battlemap -->
    <div id="battlemapWindow" class="battlemap-window" style="display: none;">
        <div class="battlemap-window-header">
            <span class="battlemap-window-title">Battlemap</span>
            <div class="battlemap-window-controls">
                <button id="battlemapFullscreenBtn" class="fullscreen-button" title="Plein écran" onclick="toggleBattlemapFullscreen()">⛶</button>
                <button class="close-button" onclick="closeBattlemapWindow()">×</button>
            </div>
        </div>
        <div class="battlemap-window-content">
            <div class="battlemap-container">
                <img id="battlemapImg" src="images/LAU-Stance-Mat-Grass.jpg" alt="Battlemap" class="battlemap-image" usemap="#image-map">
                    <map name="image-map">
                        <area target="" alt="AVANCE" title="AVANCE" href="" coords="1513,1150,2057,1374,2578,1135,2703,1273,2732,1465,2549,1678,2122,1790,1719,1750,1422,1580,1375,1295" shape="poly">
                        <area target="" alt="EXPOSEE" title="EXPOSEE" href="" coords="1205,1011,1516,1145,1364,1369,1502,1648,1875,1771,2200,1778,2526,1677,2692,1500,2700,1268,2577,1138,2873,1008,3094,1279,3156,1489,3025,1800,2707,2049,2186,2180,1683,2144,1267,1963,1013,1731,945,1366,1021,1178" shape="poly">
                        <area target="" alt="DEFENSIVE" title="DEFENSIVE" href="" coords="880,866,1202,1007,959,1329,992,1691,1260,1962,1520,2096,2034,2172,2360,2150,2743,2013,2928,1875,3098,1648,3141,1412,3058,1199,2881,1000,3199,859,3510,1152,3655,1459,3666,1798,3445,2185,3051,2478,2479,2646,1972,2679,1469,2606,999,2440,681,2201,424,1769,442,1412,623,1105" shape="poly">
                        <area target="" alt="ARRIERE" title="ARRIERE" href="" coords="413,1685,644,2231,1216,2549,1820,2687,2464,2680,3090,2474,3517,2162,3662,1707,4089,1714,4093,3381,15,3385,8,1699" shape="poly">
                    </map>
                <div id="battlemapTokensOverlay" class="battlemap-tokens-overlay"></div>
            </div>
        </div>
    </div>

    <!-- Ordre des scripts conservé -->
    <script src="/js/utils.js"></script>
    <script src="/js/constants.js"></script>
    <script src="/js/domElements.js"></script>
    <script src="/js/soundManager.js"></script>
    <script src="/js/listManagement.js"></script>
    <script src="/js/creatureDisplay.js"></script>
    <script src="/js/playerDisplay.js"></script>
    <script src="/js/fileLoader.js"></script>
    <script src="/js/eventHandlers.js"></script>
    <script src="/js/touchDrag.js"></script>
    <script src="/js/battlemap.js"></script>
    <script src="/js/main.js"></script>

</body>
</html>
